timeout: 5
graphics: yes
default_entry: 1
interface_resolution: 1280x720
interface_branding: synapseos.ru/bmosp
wallpaper_style: stretched
#wallpaper: boot():/mod/boot.jpg
#term_font: boot():/mod/CYRILL2.F16
#term_font_size: 8x16

/BMOSP (KASLR off)
	#resolution: 640x480
	#resolution: 1024x768
	protocol: limine
	resolution: 1280x720x32
	kaslr: no
	path: boot():/kernel.elf

	module_path: boot():/mod/pci_vendors.txt
	module_string: [PCI][DATA][VENDORS]

	module_path: boot():/mod/pci_data.ko
	module_string: [MOD]pci_data.ko

	module_path: boot():/mod/pci.ko
	module_string: [MOD]pci.ko

	module_path: boot():/mod/ps2.ko
	module_string: [MOD]ps2.ko

	module_path: boot():/mod/cpubench.ko
	module_string: [MOD]cpubench.ko

	module_path: boot():/mod/hello.ko
	module_string: [MOD]hello.ko

	module_path: boot():/mod/doom.ko
	module_string: [MOD]doom.ko

	module_path: boot():/mod/ios.ko
	module_string: [MOD][IO]ios.ko
